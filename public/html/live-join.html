<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join Live Quiz – SigMath</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"><link rel="stylesheet" href="/css/dark-mode.css"><link rel="stylesheet" href="/css/live.css"></head><body><div class="wrap">
<div id="join"><h1>🎮 Join a Live Quiz</h1><div class="card"><label>Game code</label><input id="pin" inputmode="numeric" maxlength="6" placeholder="6-digit code"><label>Your name</label><input id="name" maxlength="20"><button onclick="join()">Join</button><p id="err" style="color:#b91c1c"></p></div></div>
<div id="wait" class="hide" style="text-align:center"><div class="big">You're in! 🎉</div><p>Waiting for the teacher to start…</p></div>
<div id="play" class="hide"><div class="row"><span id="cnt"></span><span id="timer"></span></div><div class="big" id="qtext"></div><div class="opts" id="opts"></div><p id="locked"></p></div>
<div id="result" class="hide" style="text-align:center"><div class="big" id="rtitle"></div><p id="rinfo"></p><p>Waiting for the next question…</p></div>
<div id="final" class="hide" style="text-align:center"><div class="big">Game over!</div><p id="fmsg"></p><a href="/dashboard.html" style="color:var(--accent)">Back to dashboard</a></div>
</div><script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
const user=JSON.parse(localStorage.getItem('SigMath_user')||'null');if(user&&user.full_name)$('name').value=user.full_name
const qp=new URLSearchParams(location.search).get('pin');if(qp)$('pin').value=qp
let socket,tick,me,pin,pid
function show(id){['join','wait','play','result','final'].forEach(s=>$(s).classList.toggle('hide',s!==id))}
function connect(){socket=io()
socket.on('connect',()=>{if(pid)socket.emit('player:rejoin',{pin,pid},r=>{if(!r.ok){sessionStorage.removeItem('liveSession');pid=null;show('join');$('err').textContent='The game ended or you were removed.'}else me=r.name})})
socket.on('question',d=>{show('play');$('cnt').textContent='Question '+(d.index+1)+' of '+d.total;$('qtext').textContent=d.q;$('locked').textContent=d.answered?'Answer locked in ✔':'';$('opts').innerHTML=d.options.map((o,i)=>'<button class="opt o'+i+'" '+(d.answered?'disabled ':'')+'onclick="pick('+i+')">'+esc(o)+'</button>').join('');let t=d.time;$('timer').textContent='⏱ '+t;clearInterval(tick);tick=setInterval(()=>{t=Math.max(0,t-1);$('timer').textContent='⏱ '+t;$('timer').classList.toggle('urgent',t<=5&&t>0)},1000)})
socket.on('result',r=>{clearInterval(tick);show('result');$('rtitle').textContent=!r.answered?"⏰ Time's up":r.correct?'✅ Correct! +'+r.points:'❌ Not quite';$('rinfo').textContent='Score: '+r.score+' · Rank: #'+r.rank;if(window.LiveFX){if(r.correct){LiveFX.confetti(90,.5,.35);LiveFX.vibrate([80,40,80])}else{LiveFX.shake();LiveFX.vibrate(220)}}})
socket.on('final',lb=>{sessionStorage.removeItem('liveSession');show('final');const m=lb.find(x=>x.name===me);$('fmsg').textContent=m?'You placed #'+m.rank+' with '+m.score+' points.':'';if(m&&m.rank<=3&&window.LiveFX){LiveFX.confetti(220,.5,.3);LiveFX.vibrate([100,50,100,50,200])}})
socket.on('ended',m=>{sessionStorage.removeItem('liveSession');show('final');$('fmsg').textContent=m})}
function join(){connect();socket.emit('player:join',{pin:$('pin').value.trim(),name:$('name').value},r=>{if(!r.ok){$('err').textContent=r.error;socket.disconnect();return}me=r.name;pid=r.pid;pin=r.pin;sessionStorage.setItem('liveSession',JSON.stringify({pin,pid,name:me}));show('wait')})}
function pick(i){$('locked').textContent='Sending…';socket.emit('player:answer',{choice:i},ok=>{if(ok){[...$('opts').children].forEach((b,j)=>{b.disabled=true;if(j!==i)b.classList.add('dim')});$('locked').textContent='Answer locked in ✔';window.LiveFX&&LiveFX.vibrate(30)}else $('locked').textContent='Not sent - tap your answer again.'})}
const saved=JSON.parse(sessionStorage.getItem('liveSession')||'null');if(saved){pin=saved.pin;pid=saved.pid;me=saved.name;connect();show('wait')}
</script><script src="/js/dark-mode.js"></script><script src="/js/live-fx.js"></script></body></html>
