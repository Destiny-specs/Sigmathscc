<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Quiz – SigMath</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0f2a4a;color:#fff;min-height:100vh}.wrap{max-width:900px;margin:0 auto;padding:24px}.card{background:#fff;color:#1a2b3c;border-radius:16px;padding:20px;margin-bottom:14px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;margin:4px 0 10px}button{background:#185FA5;color:#fff;border:0;border-radius:10px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer}button.alt{background:#e2e8f0;color:#1a2b3c}button:disabled{opacity:.5}.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.opt{border-radius:12px;padding:20px;font-size:20px;font-weight:700;color:#fff;text-align:left}.o0{background:#e21b3c}.o1{background:#1368ce}.o2{background:#d89e00}.o3{background:#26890c}.dim{opacity:.3}.row{display:flex;justify-content:space-between;padding:8px 12px;background:rgba(255,255,255,.12);border-radius:8px;margin:6px 0}.chip{display:inline-block;background:rgba(255,255,255,.18);padding:6px 12px;border-radius:20px;margin:4px}.hide{display:none}.big{font-size:28px;font-weight:800;margin:10px 0}.pin{font-size:72px;font-weight:800;letter-spacing:8px;text-align:center}.err{color:#fca5a5}@media(max-width:600px){.opts{grid-template-columns:1fr}.pin{font-size:48px}}</style></head><body><div class="wrap">
<div id="setup"><h1>🎮 Live Quiz</h1><div class="card"><label>Grade level</label><select id="grade" onchange="loadLessons()"><option>Foundation</option><option>Grade 8</option><option selected>Grade 9</option><option>Grade 10</option></select><div id="lessonBox"></div><label>Other topic (optional)</label><input id="topic" placeholder="e.g. Solving quadratic equations"><label>Number of questions</label><select id="count"><option>5</option><option selected>10</option><option>15</option></select><label>Seconds per question</label><select id="time"><option>10</option><option selected>20</option><option>30</option><option>45</option></select><button onclick="gen()">Generate with AI</button> <a href="/teacher.html" style="color:#185FA5;margin-left:12px">Back</a><p id="msg"></p></div></div>
<div id="edit" class="hide"><h1>Review questions</h1><div id="qs"></div><button class="alt" onclick="addQ()">+ Add question</button> <button onclick="create()">Create game</button> <button class="alt" onclick="show('setup')">Back</button></div>
<div id="lobby" class="hide" style="text-align:center"><p>Students go to <b id="url"></b> and enter:</p><div class="pin" id="pin"></div><div id="players"></div><p id="pc">0 players</p><button onclick="socket.emit('host:start')">Start game</button></div>
<div id="game" class="hide"><div class="row"><span id="cnt"></span><span id="timer"></span><span id="ans"></span></div><div class="big" id="qtext"></div><div class="opts" id="opts"></div><div id="expl"></div><div id="board"></div><button id="nextBtn" onclick="socket.emit('host:next')">Skip</button></div>
<div id="final" class="hide"><h1>🏆 Final results</h1><div id="podium"></div><a href="/live-host.html" style="color:#fff">New game</a></div>
</div><script src="/socket.io/socket.io.js"></script><script>
const user=JSON.parse(localStorage.getItem('SigMath_user')||'null');if(!user||(user.role!=='teacher'&&user.role!=='admin')){document.body.innerHTML='<div class="wrap"><h1>Please log in as a teacher first</h1><p>Log in on the SigMath login page using the <b>Teacher</b> tab, then open this page again.</p><a href="/" style="color:#fff">Go to login</a></div>';throw new Error('Not logged in as teacher')}
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')
let Q=[],socket,tick,n=0
function show(id){['setup','edit','lobby','game','final'].forEach(s=>$(s).classList.toggle('hide',s!==id))}
const LESSONS={'Foundation':['Whole Numbers','Integers','MDAS','Fractions','Decimals','Percentages','Ratios & Proportions','Basic Algebra','Factoring Polynomials','Geometry Basics','Data & Graphs'],'Grade 8':['Algebraic Expressions','Polynomials','Measures of Central Tendency']}
function loadLessons(){const l=LESSONS[$('grade').value]||[];$('lessonBox').innerHTML=l.length?'<label>Lessons to include (pick one or more)</label>'+l.map(x=>'<label style="display:block;margin:4px 0"><input type="checkbox" class="les" value="'+esc(x)+'" style="width:auto;margin-right:8px">'+esc(x)+'</label>').join(''):'<p style="font-size:13px;color:#64748b">No preset lessons for this grade yet. Type a topic below.</p>'}
function topicText(){return [...document.querySelectorAll('.les:checked')].map(e=>e.value).concat($('topic').value.trim()?[$('topic').value.trim()]:[]).join(', ')}
async function gen(){if(!topicText()){$('msg').textContent='Pick at least one lesson or type a topic.';return}$('msg').textContent='Generating… this can take a few seconds';const res=await fetch('/live/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({teacher_id:user.id,topic:topicText(),grade:$('grade').value,count:$('count').value})}).catch(()=>null);if(!res){$('msg').textContent='Could not reach the server. It may be waking up - wait a minute and try again.';return}if(!res.ok){$('msg').textContent='Server error '+res.status+(res.status===404?': the server does not have the live quiz update yet. Make sure index.js and live.js were pushed to GitHub.':'. Check the Render logs.');return}const r=await res.json().catch(()=>({success:false,message:'The server sent an unexpected reply.'}));if(!r.success){$('msg').textContent=r.message;return}$('msg').textContent='';Q=r.questions;render();show('edit')}
function addQ(){Q.push({q:'',options:['','','',''],answer:0,explanation:''});render()}
function render(){$('qs').innerHTML=Q.map((x,i)=>'<div class="card"><b>Question '+(i+1)+'</b> <button class="alt" onclick="Q.splice('+i+',1);render()">Delete</button><textarea rows="2" oninput="Q['+i+'].q=this.value">'+esc(x.q)+'</textarea>'+x.options.map((o,j)=>'<div><input type="radio" name="r'+i+'" style="width:auto" '+(x.answer===j?'checked':'')+' onchange="Q['+i+'].answer='+j+'"> <input style="width:85%" value="'+esc(o)+'" oninput="Q['+i+'].options['+j+']=this.value"></div>').join('')+'<small>Select the radio button next to the correct answer.</small></div>').join('')}
function create(){const ok=Q.filter(x=>x.q.trim()&&x.options.every(o=>o.trim()));if(!ok.length){alert('Add at least one complete question.');return}
socket=io();socket.emit('host:create',{teacher_id:user.id,questions:ok,time:+$('time').value},r=>{if(!r.ok){alert(r.error);return}$('pin').textContent=r.pin;$('url').textContent=location.origin+'/live-join.html';show('lobby')})
socket.on('lobby',names=>{n=names.length;$('players').innerHTML=names.map(x=>'<span class="chip">'+esc(x)+'</span>').join('');$('pc').textContent=n+' players'})
socket.on('question',d=>{show('game');$('cnt').textContent='Question '+(d.index+1)+' of '+d.total;$('qtext').textContent=d.q;$('opts').innerHTML=d.options.map((o,i)=>'<div class="opt o'+i+'">'+esc(o)+'<div class="cnt"></div></div>').join('');$('expl').textContent='';$('board').innerHTML='';$('ans').textContent='0/'+n+' answered';$('nextBtn').textContent='Skip';let t=d.time;$('timer').textContent='⏱ '+t;clearInterval(tick);tick=setInterval(()=>{t=Math.max(0,t-1);$('timer').textContent='⏱ '+t},1000)})
socket.on('answered',d=>{$('ans').textContent=d.count+'/'+d.total+' answered'})
socket.on('reveal',d=>{clearInterval(tick);[...$('opts').children].forEach((el,i)=>{if(i!==d.answer)el.classList.add('dim');el.querySelector('.cnt').textContent=d.counts[i]+' students'});$('expl').innerHTML='<p>'+esc(d.explanation)+'</p>';$('board').innerHTML='<h3>Top players</h3>'+d.top.map(p=>'<div class="row"><span>'+p.rank+'. '+esc(p.name)+'</span><b>'+p.score+'</b></div>').join('');$('nextBtn').textContent=d.last?'Finish':'Next question'})
socket.on('final',lb=>{clearInterval(tick);$('podium').innerHTML=lb.slice(0,10).map(p=>'<div class="row"><span>'+(['🥇','🥈','🥉'][p.rank-1]||p.rank+'.')+' '+esc(p.name)+'</span><b>'+p.score+'</b></div>').join('');show('final')})}
loadLessons()
</script></body></html>
