<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SigMath – Teacher Profile</title>
  <link rel="stylesheet" href="/css/teacher-profile.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="/css/dark-mode.css">
  <link rel="stylesheet" href="/css/math-theme.css">
  <script src="/js/dark-mode.js"></script>
</head>
<body class="dashboard-page">

  <div class="sidebar" id="sidebar">
    <div id="sidebarContent"></div>
  </div>

  <div class="main-content">
    <div class="dashboard-header">
      <h1>👤 My Profile</h1>
      <p>Your account details.</p>
    </div>

    <div style="background:white; border-radius:16px; padding:2rem;">
      <div style="margin-bottom:1.2rem;">
        <div style="font-size:12px; color:#378ADD; margin-bottom:4px;">Full Name</div>
        <div style="font-size:16px; font-weight:bold; color:#042C53;" id="profName">—</div>
      </div>
      <div style="margin-bottom:1.2rem;">
        <div style="font-size:12px; color:#378ADD; margin-bottom:4px;">Email</div>
        <div style="font-size:16px; font-weight:bold; color:#042C53;" id="profEmail">—</div>
      </div>
      <div>
        <div style="font-size:12px; color:#378ADD; margin-bottom:4px;">Role</div>
        <div style="font-size:16px; font-weight:bold; color:#042C53;">Teacher</div>
      </div>
    </div>
  </div>

  <script>
    const user = JSON.parse(localStorage.getItem('SigMath_user'))
    if (!user || user.role !== 'teacher') window.location.href = '/'
    document.getElementById('profName').textContent = user.full_name
    document.getElementById('profEmail').textContent = user.email

    function logout() {
      localStorage.removeItem('SigMath_user')
      window.location.href = '/'
    }
  </script>
  <script>
fetch('/sidebar?role=teacher')
  .then(r => r.text())
  .then(html => {
    document.getElementById('sidebarContent').innerHTML = html
    const path = location.pathname.replace(/\/$/, '')
    document.querySelectorAll('.sidebar-btn').forEach(btn => {
      const onclick = btn.getAttribute('onclick') || ''
      const match = onclick.match(/location\.href=['"]([^'"]+)['"]/)
      if (match) {
        const btnUrl = match[1]
        if (path.endsWith(btnUrl)) {
          btn.classList.add('active')
        }
      }
    })
  })
  </script>
  <div id="bottomNavContainer"></div>
  <script>
    fetch('/bottomnav?role=teacher')
      .then(r => r.text())
      .then(html => {
        document.getElementById('bottomNavContainer').innerHTML = html
        const btns = document.querySelectorAll('.bottom-nav-btn')
        btns[4]?.classList.add('active')
      })
  </script>
</body>
</html>
