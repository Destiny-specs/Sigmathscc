<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join Live Quiz – SigMath</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0f2a4a;color:#fff;min-height:100vh}.wrap{max-width:900px;margin:0 auto;padding:24px}.card{background:#fff;color:#1a2b3c;border-radius:16px;padding:20px;margin-bottom:14px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;margin:4px 0 10px}button{background:#185FA5;color:#fff;border:0;border-radius:10px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer}button.alt{background:#e2e8f0;color:#1a2b3c}button:disabled{opacity:.5}.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.opt{border-radius:12px;padding:20px;font-size:20px;font-weight:700;color:#fff;text-align:left}.o0{background:#e21b3c}.o1{background:#1368ce}.o2{background:#d89e00}.o3{background:#26890c}.dim{opacity:.3}.row{display:flex;justify-content:space-between;padding:8px 12px;background:rgba(255,255,255,.12);border-radius:8px;margin:6px 0}.chip{display:inline-block;background:rgba(255,255,255,.18);padding:6px 12px;border-radius:20px;margin:4px}.hide{display:none}.big{font-size:28px;font-weight:800;margin:10px 0}.pin{font-size:72px;font-weight:800;letter-spacing:8px;text-align:center}.err{color:#fca5a5}@media(max-width:600px){.opts{grid-template-columns:1fr}.pin{font-size:48px}}</style></head><body><div class="wrap">
<div id="join"><h1>🎮 Join a Live Quiz</h1><div class="card"><label>Game code</label><input id="pin" inputmode="numeric" maxlength="6" placeholder="6-digit code"><label>Your name</label><input id="name" maxlength="20"><button onclick="join()">Join</button><p id="err" style="color:#b91c1c"></p></div></div>
<div id="wait" class="hide" style="text-align:center"><div class="big">You're in! 🎉</div><p>Waiting for the teacher to start…</p></div>
<div id="play" class="hide"><div class="row"><span id="cnt"></span><span id="timer"></span></div><div class="big" id="qtext"></div><div class="opts" id="opts"></div><p id="locked"></p></div>
<div id="result" class="hide" style="text-align:center"><div class="big" id="rtitle"></div><p id="rinfo"></p><p>Waiting for the next question…</p></div>
<div id="final" class="hide" style="text-align:center"><div class="big">Game over!</div><p id="fmsg"></p><a href="/dashboard.html" style="color:#fff">Back to dashboard</a></div>
</div><script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
const user=JSON.parse(localStorage.getItem('SigMath_user')||'null');if(user&&user.full_name)$('name').value=user.full_name
const qp=new URLSearchParams(location.search).get('pin');if(qp)$('pin').value=qp
let socket,tick,me
function show(id){['join','wait','play','result','final'].forEach(s=>$(s).classList.toggle('hide',s!==id))}
function join(){socket=io();socket.emit('player:join',{pin:$('pin').value.trim(),name:$('name').value},r=>{if(!r.ok){$('err').textContent=r.error;socket.disconnect();return}me=r.name;show('wait')})
socket.on('question',d=>{show('play');$('cnt').textContent='Question '+(d.index+1)+' of '+d.total;$('qtext').textContent=d.q;$('locked').textContent='';$('opts').innerHTML=d.options.map((o,i)=>'<button class="opt o'+i+'" onclick="pick('+i+')">'+esc(o)+'</button>').join('');let t=d.time;$('timer').textContent='⏱ '+t;clearInterval(tick);tick=setInterval(()=>{t=Math.max(0,t-1);$('timer').textContent='⏱ '+t},1000)})
socket.on('result',r=>{clearInterval(tick);show('result');$('rtitle').textContent=!r.answered?"⏰ Time's up":r.correct?'✅ Correct! +'+r.points:'❌ Not quite';$('rinfo').textContent='Score: '+r.score+' · Rank: #'+r.rank})
socket.on('final',lb=>{show('final');const m=lb.find(x=>x.name===me);$('fmsg').textContent=m?'You placed #'+m.rank+' with '+m.score+' points.':''})
socket.on('ended',m=>{show('final');$('fmsg').textContent=m})}
function pick(i){socket.emit('player:answer',{choice:i},()=>{});[...$('opts').children].forEach((b,j)=>{b.disabled=true;if(j!==i)b.classList.add('dim')});$('locked').textContent='Answer locked in ✔'}
</script></body></html>
