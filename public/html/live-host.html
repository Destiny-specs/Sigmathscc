<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Quiz – SigMath</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"><link rel="stylesheet" href="/css/dark-mode.css"><link rel="stylesheet" href="/css/live.css"><style>.hide{display:none!important}</style></head><body><div class="wrap">
<div id="setup"><h1>🎮 Live Quiz</h1><div class="card"><label>Grade level</label><select id="grade" onchange="loadLessons()"><option>Foundation</option><option>Grade 8</option><option selected>Grade 9</option><option>Grade 10</option></select><div id="lessonBox"></div><label>Other topic (optional)</label><input id="topic" placeholder="e.g. Solving quadratic equations"><label>Number of questions</label><select id="count"><option>5</option><option selected>10</option><option>15</option></select><label>Seconds per question</label><select id="time"><option>10</option><option selected>20</option><option>30</option><option>45</option></select><button onclick="gen()">Generate with AI</button> <a href="/teacher.html" style="color:var(--accent);margin-left:12px">Back</a><p id="msg"></p></div></div>
<div id="edit" class="hide"><h1>Review questions</h1><p id="editnote" style="color:var(--warn)"></p><p>Check every answer before you start. The AI can make mistakes.</p><div id="qs"></div><button class="alt" onclick="addQ()">+ Add question</button> <button onclick="create()">Create game</button> <button class="alt" onclick="show('setup')">Back</button></div>
<div id="lobby" class="hide" style="text-align:center"><p>Students go to <b id="url"></b> and enter:</p><div class="pin" id="pin"></div><div id="players"></div><p id="pc">0 players</p><button onclick="socket.emit('host:start')">Start game</button></div>
<div id="game" class="hide"><div class="row"><span id="cnt"></span><span id="timer"></span><span id="ans"></span></div><div class="big" id="qtext"></div><div class="opts" id="opts"></div><div id="expl"></div><div id="board"></div><button id="nextBtn" onclick="socket.emit('host:next')">Skip</button></div>
<div id="final" class="hide"><h1>🏆 Final results</h1><div id="podium"></div><a href="/live-host.html" style="color:var(--accent)">New game</a></div>
</div><script src="/socket.io/socket.io.js"></script><script>
const user=JSON.parse(localStorage.getItem('SigMath_user')||'null');if(!user||(user.role!=='teacher'&&user.role!=='admin')){document.body.innerHTML='<div class="wrap"><h1>Please log in as a teacher first</h1><p>Log in on the SigMath login page using the <b>Teacher</b> tab, then open this page again.</p><a href="/" style="color:var(--accent)">Go to login</a></div>';throw new Error('Not logged in as teacher')}
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')
let Q=[],socket,tick,n=0
function show(id){['setup','edit','lobby','game','final'].forEach(s=>$(s).classList.toggle('hide',s!==id))}
const LESSONS={'Foundation':['Whole Numbers','Integers','MDAS','Fractions','Decimals','Percentages','Ratios & Proportions','Basic Algebra','Factoring Polynomials','Geometry Basics','Data & Graphs'],'Grade 8':['Algebraic Expressions','Polynomials','Measures of Central Tendency']}
function loadLessons(){const l=LESSONS[$('grade').value]||[];$('lessonBox').innerHTML=l.length?'<label>Lessons to include (pick one or more)</label>'+l.map(x=>'<label style="display:block;margin:4px 0"><input type="checkbox" class="les" value="'+esc(x)+'" style="width:auto;margin-right:8px">'+esc(x)+'</label>').join(''):'<p style="font-size:13px;color:var(--muted)">No preset lessons for this grade yet. Type a topic below.</p>'}
function topicText(){return [...document.querySelectorAll('.les:checked')].map(e=>e.value).concat($('topic').value.trim()?[$('topic').value.trim()]:[]).join(', ')}
async function gen(){if(!topicText()){$('msg').textContent='Pick at least one lesson or type a topic.';return}$('msg').textContent='Generating… this can take a few seconds';const res=await fetch('/live/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({teacher_id:user.id,topic:topicText(),grade:$('grade').value,count:$('count').value})}).catch(()=>null);if(!res){$('msg').textContent='Could not reach the server. It may be waking up - wait a minute and try again.';return}if(!res.ok){$('msg').textContent='Server error '+res.status+(res.status===404?': the server does not have the live quiz update yet. Make sure index.js and live.js were pushed to GitHub.':'. Check the Render logs.');return}const r=await res.json().catch(()=>({success:false,message:'The server sent an unexpected reply.'}));if(!r.success){$('msg').textContent=r.message;return}$('msg').textContent='';Q=r.questions;$('editnote').textContent=r.note||'';render();show('edit')}
function addQ(){Q.push({q:'',options:['','','',''],answer:0,explanation:''});render()}
function render(){$('qs').innerHTML=Q.map((x,i)=>'<div class="card"><b>Question '+(i+1)+'</b> <button class="alt" onclick="Q.splice('+i+',1);render()">Delete</button><textarea rows="2" oninput="Q['+i+'].q=this.value">'+esc(x.q)+'</textarea>'+x.options.map((o,j)=>'<div><input type="radio" name="r'+i+'" style="width:auto" '+(x.answer===j?'checked':'')+' onchange="Q['+i+'].answer='+j+'"> <input style="width:85%" value="'+esc(o)+'" oninput="Q['+i+'].options['+j+']=this.value"></div>').join('')+'<input placeholder="Explanation shown after the question (optional)" value="'+esc(x.explanation||'')+'" oninput="Q['+i+'].explanation=this.value"><small>Select the radio button next to the correct answer.</small></div>').join('')}
function create(){const ok=Q.filter(x=>x.q.trim()&&x.options.every(o=>o.trim()));if(!ok.length){alert('Add at least one complete question.');return}
socket=io();socket.on('connect',()=>{if(window.gamePin)socket.emit('host:rejoin',{pin:window.gamePin,teacher_id:user.id},()=>{})});socket.emit('host:create',{teacher_id:user.id,questions:ok,time:+$('time').value},r=>{if(!r.ok){alert(r.error);return}window.gamePin=r.pin;$('pin').textContent=r.pin;$('url').textContent=location.origin+'/live-join.html';show('lobby')})
socket.on('lobby',names=>{n=names.length;$('players').innerHTML=names.map(x=>'<span class="chip">'+esc(x)+'</span>').join('');$('pc').textContent=n+' players'})
socket.on('question',d=>{show('game');$('cnt').textContent='Question '+(d.index+1)+' of '+d.total;$('qtext').textContent=d.q;$('opts').innerHTML=d.options.map((o,i)=>'<div class="opt o'+i+'">'+esc(o)+'<div class="cnt"></div></div>').join('');$('expl').textContent='';$('board').innerHTML='';$('ans').textContent='0/'+n+' answered';$('nextBtn').textContent='Skip';let t=d.time;$('timer').textContent='⏱ '+t;clearInterval(tick);tick=setInterval(()=>{t=Math.max(0,t-1);$('timer').textContent='⏱ '+t;$('timer').classList.toggle('urgent',t<=5&&t>0)},1000)})
socket.on('answered',d=>{$('ans').textContent=d.count+'/'+d.total+' answered'})
socket.on('reveal',d=>{clearInterval(tick);window.LiveFX&&LiveFX.confetti(35,.5,.3);[...$('opts').children].forEach((el,i)=>{if(i!==d.answer)el.classList.add('dim');else el.classList.add('correct');el.querySelector('.cnt').textContent=d.counts[i]+' students'});$('expl').innerHTML='<p>'+esc(d.explanation)+'</p>';$('board').innerHTML='<h3>Top players</h3>'+d.top.map(p=>'<div class="row"><span>'+p.rank+'. '+esc(p.name)+'</span><b>'+p.score+'</b></div>').join('');$('nextBtn').textContent=d.last?'Finish':'Next question'})
socket.on('final',lb=>{clearInterval(tick);window.LiveFX&&LiveFX.confetti(220,.5,.3);$('podium').innerHTML=lb.slice(0,10).map(p=>'<div class="row"><span>'+(['🥇','🥈','🥉'][p.rank-1]||p.rank+'.')+' '+esc(p.name)+'</span><b>'+p.score+'</b></div>').join('');show('final')})}
loadLessons()
</script><script src="/js/dark-mode.js"></script><script src="/js/live-fx.js"></script></body></html>
