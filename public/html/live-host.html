<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Quiz – SigMath</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"><link rel="stylesheet" href="/css/dark-mode.css"><link rel="stylesheet" href="/css/live.css"><link rel="stylesheet" href="/css/boss-battle.css"><style>.hide{display:none!important}</style></head><body><div class="wrap">
<div id="setup"><h1>🎮 Live Quiz</h1><div class="card"><label>Grade level</label><select id="grade" onchange="loadLessons()"><option>Foundation</option><option>Grade 8</option><option selected>Grade 9</option><option>Grade 10</option></select><div id="lessonBox"></div><label>Other topic (optional)</label><input id="topic" placeholder="e.g. Solving quadratic equations"><label>Number of questions</label><select id="count"><option>5</option><option selected>10</option><option>15</option></select><label>Question types</label><select id="qtype"><option value="mc">Multiple choice only</option><option value="mix">Mix: multiple choice and true/false</option></select><label>Seconds per question</label><select id="time"><option>10</option><option selected>20</option><option>30</option><option>45</option></select><label>Game mode</label><select id="gmode" onchange="document.getElementById('diffbox').classList.toggle('hide',this.value!=='boss')"><option value="classic">Classic (race for the top spot)</option><option value="boss">Boss Battle (the class vs a boss)</option></select><div id="diffbox" class="hide"><label>Boss strength</label><select id="gdiff"><option value="easy">Easy</option><option value="normal" selected>Normal</option><option value="hard">Hard</option></select></div><button onclick="gen()">Generate with AI</button> <a href="/teacher.html" style="color:var(--accent);margin-left:12px">Back</a><p id="msg"></p></div></div>
<div id="edit" class="hide"><h1>Review questions</h1><p id="editnote" style="color:var(--warn)"></p><p>Check every answer before you start. The AI can make mistakes.</p><div id="qs"></div><button class="alt" onclick="addQ('mc')">+ Multiple choice</button> <button class="alt" onclick="addQ('tf')">+ True/False</button> <button onclick="create()">Create game</button> <button class="alt" onclick="show('setup')">Back</button></div>
<div id="lobby" class="hide" style="text-align:center"><p>Students go to <b id="url"></b> and enter:</p><div class="pin" id="pin"></div><div id="players"></div><p id="pc">0 players</p><button class="alt" id="lockBtn" onclick="lock()">Lock game</button> <button onclick="startGame()">Start game</button></div>
<div id="game" class="hide"><div class="row"><span id="cnt"></span><span id="timer"></span><span id="ans"></span></div><div class="bar"><i id="barfill"></i></div><div id="jp" class="jackpot hide"></div><div id="bossPanel" class="hide"><div class="card bhud"><div id="bhearts"></div><div class="bn"><b id="bnm"></b> <span id="bhp"></span><div class="hp"><b class="ghost" id="bghost"></b><i id="bfill"></i></div></div></div><div id="barena"><div id="bcam"><div class="sky"></div><div class="far"></div><div class="ground"></div><div id="crew"></div><div id="bface"></div></div><div id="bbanner"></div><div id="bpow"></div></div></div><div class="big" id="qtext"></div><div class="opts" id="opts"></div><div id="popins" style="text-align:center;min-height:40px"></div><div id="expl"></div><div id="board"></div><button id="nextBtn" onclick="socket.emit('host:next')">Skip</button></div>
<div id="final" class="hide"><h1>🏆 Final results</h1><div id="podium"></div><a href="/live-host.html" style="color:var(--accent)">New game</a></div>
</div><div id="bossFlash"></div><script src="/socket.io/socket.io.js"></script><script>
const user=JSON.parse(localStorage.getItem('SigMath_user')||'null');if(!user||(user.role!=='teacher'&&user.role!=='admin')){document.body.innerHTML='<div class="wrap"><h1>Please log in as a teacher first</h1><p>Log in on the SigMath login page using the <b>Teacher</b> tab, then open this page again.</p><a href="/" style="color:var(--accent)">Go to login</a></div>';throw new Error('Not logged in as teacher')}
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')
let Q=[],socket,tick,n=0
function show(id){['setup','edit','lobby','game','final'].forEach(s=>$(s).classList.toggle('hide',s!==id))}
const LESSONS={'Foundation':['Whole Numbers','Integers','MDAS','Fractions','Decimals','Percentages','Ratios & Proportions','Basic Algebra','Factoring Polynomials','Geometry Basics','Data & Graphs'],'Grade 8':['Algebraic Expressions','Polynomials','Measures of Central Tendency']}
function loadLessons(){const l=LESSONS[$('grade').value]||[];$('lessonBox').innerHTML=l.length?'<label>Lessons to include (pick one or more)</label>'+l.map(x=>'<label style="display:block;margin:4px 0"><input type="checkbox" class="les" value="'+esc(x)+'" style="width:auto;margin-right:8px">'+esc(x)+'</label>').join(''):'<p style="font-size:13px;color:var(--muted)">No preset lessons for this grade yet. Type a topic below.</p>'}
function topicText(){return [...document.querySelectorAll('.les:checked')].map(e=>e.value).concat($('topic').value.trim()?[$('topic').value.trim()]:[]).join(', ')}
async function gen(){if(!topicText()){$('msg').textContent='Pick at least one lesson or type a topic.';return}$('msg').textContent='Generating… this can take a few seconds';const res=await fetch('/live/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({teacher_id:user.id,topic:topicText(),grade:$('grade').value,count:$('count').value,qtype:$('qtype').value})}).catch(()=>null);if(!res){$('msg').textContent='Could not reach the server. It may be waking up - wait a minute and try again.';return}if(!res.ok){$('msg').textContent='Server error '+res.status+(res.status===404?': the server does not have the live quiz update yet. Make sure index.js and live.js were pushed to GitHub.':'. Check the Render logs.');return}const r=await res.json().catch(()=>({success:false,message:'The server sent an unexpected reply.'}));if(!r.success){$('msg').textContent=r.message;return}$('msg').textContent='';Q=r.questions;$('editnote').textContent=r.note||'';render();show('edit')}
function addQ(t){Q.push(t==='text'?{type:'text',q:'',accepted:[],explanation:'',hint:''}:t==='tf'?{type:'tf',q:'',options:['True','False'],answer:0,explanation:'',hint:''}:{type:'mc',q:'',options:['','','',''],answer:0,explanation:'',hint:''});render()}
function render(){$('qs').innerHTML=Q.map((x,i)=>{const T={mc:'Multiple choice',tf:'True / False',text:'Typed answer'}[x.type||'mc'];return '<div class="card"><b>Question '+(i+1)+' - '+T+'</b> <button class="alt" onclick="Q.splice('+i+',1);render()">Delete</button><textarea rows="2" oninput="Q['+i+'].q=this.value">'+esc(x.q)+'</textarea>'+(x.type==='text'?'<input placeholder="Accepted answers, separated by a vertical bar (example: 12 | 12.0)" value="'+esc((x.accepted||[]).join(' | '))+'" oninput="Q['+i+'].accepted=this.value.split(String.fromCharCode(124)).map(s=>s.trim()).filter(Boolean)">':(x.options||[]).map((o,j)=>'<div><input type="radio" name="r'+i+'" style="width:auto" '+(x.answer===j?'checked':'')+' onchange="Q['+i+'].answer='+j+'"> <input style="width:85%" value="'+esc(o)+'" oninput="Q['+i+'].options['+j+']=this.value"></div>').join('')+'<small>Select the radio button next to the correct answer.</small>')+'<input placeholder="Explanation shown after the question (optional)" value="'+esc(x.explanation||'')+'" oninput="Q['+i+'].explanation=this.value"><input placeholder="Hint for the Hint card (optional, should not give away the answer)" value="'+esc(x.hint||'')+'" oninput="Q['+i+'].hint=this.value"></div>'}).join('')}
let locked=false
function startGame(){socket.emit('host:start',{},r=>{if(r&&!r.ok)alert(r.error)})}
function lock(){locked=!locked;socket.emit('host:lock',{locked});$('lockBtn').textContent=locked?'Unlock game':'Lock game'}
function kick(i){if(confirm('Remove '+window.lobbyNames[i]+' from the game?'))socket.emit('host:kick',{name:window.lobbyNames[i]})}
function sh(d){return (d.first?'<div class="callout">'+LiveFX.icon('bolt','hot')+' '+LiveFX.who(d.first,28)+' '+esc(d.first.name)+' answered first! ('+(d.first.ms/1000).toFixed(1)+'s)</div>':'')+(d.callouts||[]).map(c=>'<div class="callout">'+esc(c)+'</div>').join('')}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));let bossShown=null,bossIntroDone=false
const BI=id=>BossArt.info[id]||{}
function setHp(hp,max){const w=Math.round(100*hp/max)+'%';$('bfill').style.width=w;$('bghost').style.width=w;$('bhp').textContent=Math.max(0,Math.round(hp))+' / '+max+' HP'}
function bossHud(b,intro,keepHearts){const p=$('bossPanel');if(!b){p.classList.add('hide');return}p.classList.remove('hide');$('bnm').textContent=b.name;const f=$('bface'),ar=$('barena')
if(f.dataset.id!==b.id){f.dataset.id=b.id;f.innerHTML=BossArt.svg(b.id,300);f.style.setProperty('--bc',BI(b.id).color||'#fff');ar.className='th-'+(BI(b.id).theme||'cosmos')}
setHp(b.hp,b.max);bossShown=b.hp;if(!keepHearts)$('bhearts').innerHTML=BossFX.hearts(b.hearts);f.classList.toggle('ph2',b.phase===2);f.classList.toggle('rage',b.phase===3&&b.hp>0)
if(intro&&!bossIntroDone){bossIntroDone=true;setTimeout(()=>bossIntro(b),120);LiveFX.music.start(b.id)}}
async function bossIntro(b){const f=$('bface'),ar=$('barena'),fx=ar._fx||(ar._fx=BossFX.mk(ar)),inf=BI(b.id)
LiveFX.sfx('entrance')
f.animate([{transform:'translateY(-190px) scale(1.5)',opacity:0},{transform:'translateY(0) scale(1)',opacity:1,offset:.6},{transform:'translateY(6px) scale(1.06,.94)',offset:.78},{transform:'translateY(0) scale(1)',opacity:1}],{duration:950,easing:'cubic-bezier(.5,0,.8,.5)'})
fx.banner($('bbanner'),(inf.name||'').toUpperCase());await sleep(600);LiveFX.sfx('boom');fx.shake(10)
const P=f.getBoundingClientRect(),A=ar.getBoundingClientRect();fx.impact(P.left+P.width/2-A.left,A.height-48,inf.color||'#fff','',true)
await sleep(380);LiveFX.sfx('roar');fx.banner($('bbanner'),inf.title||'');f.animate([{transform:'scale(1)'},{transform:'scale(1.12)'},{transform:'scale(1)'}],{duration:600})}
function bossReveal(d){return BossBattle.run(d,{$:$,esc:esc,shown:()=>bossShown,setHp:setHp,hud:b=>bossHud(b,false,true)})}
function bossEnd(b){const win=b.result==='win',stars=win?Math.max(1,b.hearts):0;return '<div class="card" style="text-align:center"><h2>'+(win?'VICTORY!':'DEFEATED...')+'</h2><div style="display:inline-block">'+BossArt.svg(b.id,130)+'</div><p>'+(win?'The class defeated <b>'+esc(b.name)+'</b>!':'<b>'+esc(b.name)+'</b> survived with '+b.hp+' HP left.')+'</p>'+(win?'<div style="font-size:40px;color:var(--c2)">'+'\u2605'.repeat(stars)+'</div>':'')+(win?BossBattle.lootHost(b,esc):'')+'</div>'}
function create(){bossIntroDone=false;const bf=$('bface');bf.dataset.id='';bf.className='';bf.getAnimations().forEach(a=>a.cancel());const ok=Q.filter(x=>x.q.trim()&&(x.type==='text'?(x.accepted||[]).length:x.options.every(o=>o.trim())));if(!ok.length){alert('Add at least one complete question.');return}
socket=io();socket.on('connect',()=>{if(window.gamePin)socket.emit('host:rejoin',{pin:window.gamePin,teacher_id:user.id},r=>{if(!r||!r.ok){alert('This game is no longer running because the server restarted. Please create a new game.');location.reload()}})});socket.emit('host:create',{teacher_id:user.id,questions:ok,time:+$('time').value,mode:$('gmode').value,diff:$('gdiff').value},r=>{if(!r.ok){alert(r.error);return}window.gamePin=r.pin;$('pin').textContent=r.pin;$('url').textContent=location.origin+'/live-join.html';show('lobby');clearInterval(window.syncT);window.syncT=setInterval(()=>{if(socket.connected)socket.emit('host:sync')},4000)})
socket.on('lobby',(names,avs)=>{if(names.length>n)LiveFX.sfx('join');n=names.length;window.lobbyNames=names;$('players').innerHTML=names.map((x,i)=>'<span class="chip">'+LiveFX.who({name:x,av:(avs||[])[i]},30)+' '+esc(x)+' <b style="cursor:pointer;margin-left:6px" title="Remove" onclick="kick('+i+')">x</b></span>').join('');$('pc').textContent=n+' players'})
socket.on('ready',d=>{LiveFX.countdown(d);bossHud(d.boss)})
socket.on('question',d=>{LiveFX.countdownEnd();BossBattle.cancel();if(d.index===0)BossBattle.reset();bossHud(d.boss,true);if(d.boss)BossBattle.pow(d.boss,{$:$});$('popins').innerHTML='';show('game');$('cnt').textContent='Question '+(d.index+1)+' of '+d.total;$('qtext').textContent=d.q;LiveFX.bar($('barfill'),d.time);$('jp').innerHTML=d.jackpot?LiveFX.icon('star')+' FINAL JACKPOT: DOUBLE POINTS '+LiveFX.icon('star'):'';$('jp').classList.toggle('hide',!d.jackpot);$('opts').innerHTML=d.type==='text'?'<div class="card" style="grid-column:1/-1">Students type their answer on their own device.</div>':d.options.map((o,i)=>'<div class="opt o'+i+'">'+LiveFX.icon('s'+i,'shape')+esc(o)+'<div class="cnt"></div></div>').join('');$('expl').textContent='';$('board').innerHTML='';$('ans').textContent='0/'+n+' answered';$('nextBtn').textContent='Skip';let t=d.time;$('timer').textContent='⏱ '+t;clearInterval(tick);tick=setInterval(()=>{t=Math.max(0,t-1);$('timer').textContent='⏱ '+t;$('timer').classList.toggle('urgent',t<=5&&t>0);if(t<=5&&t>0)LiveFX.sfx('time')},1000)})
socket.on('answered',d=>{$('ans').textContent=d.count+'/'+d.total+' answered';if(d.name)LiveFX.sfx('click');if(d.name)$('popins').insertAdjacentHTML('beforeend','<span class="popin" title="'+esc(d.name)+'">'+LiveFX.who({name:d.name,av:d.av},36)+'</span>')})
socket.on('reveal',d=>{clearInterval(tick);window.LiveFX&&LiveFX.confetti(35,.5,.3);LiveFX.sfx('whoosh');$('barfill').style.animationPlayState='paused';if(d.type!=='text')[...$('opts').children].forEach((el,i)=>{if(i!==d.answer)el.classList.add('dim');else el.classList.add('correct');el.querySelector('.cnt').textContent=d.counts[i]+' students'});$('expl').innerHTML='<p>'+(d.type==='text'?'Correct answer: <b>'+esc(d.answerText)+'</b> - '+d.correctCount+' of '+d.total+' got it right<br>':'')+esc(d.explanation)+'</p>';$('board').innerHTML=sh(d)+'<h3>Top players</h3>'+d.top.map(p=>'<div class="row"><span>'+p.rank+'. '+LiveFX.who(p,26)+' '+esc(p.name)+(p.streak>=3?' '+LiveFX.icon('flame','hot'):'')+LiveFX.delta(p.delta)+'</span><b>'+p.score+'</b></div>').join('');$('nextBtn').textContent=d.last?'Finish':'Next question'})
socket.on('reveal',d=>{if(d.boss)bossReveal(d)})
socket.on('final',(lb,aw,boss)=>{BossBattle.cancel();BossBattle.phoneCancel();LiveFX.music.stop();clearInterval(tick);window.LiveFX&&LiveFX.confetti(220,.5,.3);if(!boss||boss.result==='win')LiveFX.sfx('fanfare');$('podium').innerHTML=(boss?bossEnd(boss):'')+LiveFX.podium(lb,esc)+((aw||[]).length?'<h2>Awards</h2>'+LiveFX.awards(aw,esc):'');show('final')})}
loadLessons()
</script><script src="/js/dark-mode.js"></script><script src="/js/live-fx.js"></script><script src="/js/boss-art.js"></script><script src="/js/boss-fx.js"></script><script src="/js/boss-battle.js"></script></body></html>
