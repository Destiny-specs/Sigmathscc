<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avatar Studio - SigMath</title>
<link rel="stylesheet" href="/css/dark-mode.css"><link rel="stylesheet" href="/css/live.css"><link rel="stylesheet" href="/css/boss-battle.css"><link rel="stylesheet" href="/css/avatar-maker.css">
<style>
body{background:#0b0b1a;color:#e8e8ff;font-family:system-ui,Segoe UI,Arial,sans-serif;margin:0}
.wrap{max-width:720px;margin:0 auto;padding:18px 14px 90px;position:relative;z-index:2}
h1{margin:0 0 4px}p{opacity:.85;margin:4px 0 12px}
.go{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.go a{background:#3a2a78;color:#fff;border:2px solid #5b3fa8;border-radius:12px;padding:10px 16px;font-weight:800;text-decoration:none}
.go a:hover{background:#5b3fa8}
#saved{font-size:13px;color:#7df9ff;min-height:18px}
</style></head><body>
<div class="wrap">
<h1>Avatar Studio</h1>
<p id="note">Design your hero! Your avatar is saved on this device automatically and is used in live quizzes and boss fights.</p>
<div id="saved"></div>
<div id="mk"></div>
<div class="go"><a href="/live-join.html">Join a live quiz</a><a href="/boss.html">Boss battle</a></div>
</div>
<script src="/js/live-fx.js"></script><script src="/js/progress.js"></script><script src="/js/avatar-sync.js"></script><script src="/js/avatar-maker.js"></script>
<script>
let t=null
const MK=AvatarMaker.mount(document.getElementById('mk'),{av:localStorage.getItem('liveAv')||'',onChange:a=>{localStorage.setItem('liveAv',a);const s=document.getElementById('saved');s.textContent='Saved!';clearTimeout(t);t=setTimeout(()=>s.textContent='',1400)}})
let u=null;try{u=JSON.parse(localStorage.getItem('SigMath_user'))}catch(e){}
document.getElementById('note').textContent=u&&u.id?'Design your hero! Your avatar, saved looks and boss loot are saved to your account, so they follow you to any device.':'Design your hero! Your avatar is saved on this device. Log in to keep it on every device.'
AvSync.onApplied(function(ch){if(!ch)return;const a=localStorage.getItem('liveAv');if(LiveFX.valid(a))MK.set(a)})
</script></body></html>
