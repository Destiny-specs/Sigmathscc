<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join Live Quiz – SigMath</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"><link rel="stylesheet" href="/css/dark-mode.css"><link rel="stylesheet" href="/css/live.css"><style>.hide{display:none!important}</style></head><body><div class="wrap">
<div id="join"><h1>🎮 Join a Live Quiz</h1><div class="card"><label>Game code</label><input id="pin" inputmode="numeric" maxlength="6" placeholder="6-digit code"><label>Your name</label><input id="name" maxlength="20"><small style="color:var(--muted)">No account needed. Use any name you like.</small><button onclick="join()">Join</button><p id="err" style="color:#b91c1c"></p></div></div>
<div id="wait" class="hide" style="text-align:center"><div class="big" id="myav" style="font-size:72px"></div><div class="big">You're in!</div><p>Waiting for the teacher to start…</p></div>
<div id="play" class="hide"><div class="row"><span id="cnt"></span><span id="timer"></span></div><div class="bar"><i id="barfill"></i></div><div id="stk" class="hot"></div><div id="jp" class="jackpot hide"></div><div class="big" id="qtext"></div><div class="opts" id="opts"></div><div id="pw"><button id="bDbl" class="pw" onclick="pdbl()"></button><button id="bHint" class="pw" onclick="phint()"></button><button id="bShd" class="pw" onclick="pshd()"></button></div><p id="hintbox"></p><p id="locked"></p></div>
<div id="result" class="hide" style="text-align:center"><div id="rico"></div><div class="big" id="rtitle"></div><p id="rinfo"></p><div id="lb" style="text-align:left;margin:12px 0"></div><p>Waiting for the next question…</p></div>
<div id="final" class="hide" style="text-align:center"><div class="big">Game over!</div><p id="fmsg"></p><a href="/dashboard.html" style="color:var(--accent)">Back to dashboard</a></div>
</div><script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
const user=JSON.parse(localStorage.getItem('SigMath_user')||'null');if(user&&user.full_name)$('name').value=user.full_name;else $('name').value='Guest'+Math.floor(1000+Math.random()*9000)
const qp=new URLSearchParams(location.search).get('pin');if(qp)$('pin').value=qp
let socket,tick,me,pin,pid
function show(id){['join','wait','play','result','final'].forEach(s=>$(s).classList.toggle('hide',s!==id))}
function connect(){socket=io()
socket.on('connect',()=>{if(pid)socket.emit('player:rejoin',{pin,pid},r=>{if(!r.ok){sessionStorage.removeItem('liveSession');pid=null;show('join');$('err').textContent='The game ended or you were removed.'}else{me=r.name;$('myav').textContent=LiveFX.avatar(me)}})})
socket.on('question',d=>{show('play');$('cnt').textContent='Question '+(d.index+1)+' of '+d.total;$('qtext').textContent=d.q;LiveFX.bar($('barfill'),d.time);$('stk').innerHTML=d.streak>=2?LiveFX.icon('flame','hot')+' '+d.streak+' in a row!':'';renderPU(d);$('locked').innerHTML=d.answered?LiveFX.icon('lock')+' Answer locked in':'';$('opts').innerHTML=d.type==='text'?'<div style="grid-column:1/-1"><input id="tin" placeholder="Type your answer" autocomplete="off" autocapitalize="off" '+(d.answered?'disabled ':'')+'onkeydown="if(event.key===\'Enter\')sendText()"><button '+(d.answered?'disabled ':'')+'onclick="sendText()">Submit</button></div>':d.options.map((o,i)=>'<button class="opt o'+i+'" '+(d.answered?'disabled ':'')+'onclick="pick('+i+')">'+LiveFX.icon('s'+i,'shape')+esc(o)+'</button>').join('');let t=d.time;$('timer').textContent='⏱ '+t;clearInterval(tick);tick=setInterval(()=>{t=Math.max(0,t-1);$('timer').textContent='⏱ '+t;$('timer').classList.toggle('urgent',t<=5&&t>0)},1000)})
socket.on('result',r=>{clearInterval(tick);show('result');$('barfill').style.animationPlayState='paused';const k=!r.answered?'clock':r.correct?'check':'cross';$('rico').innerHTML=LiveFX.icon(k,'bigico draw '+(r.correct?'good':r.answered?'bad':'late'));$('rtitle').textContent=!r.answered?"Time's up":r.correct?(r.streak>=3?'On fire! +':r.points>=900?'Lightning fast! +':'Correct! +')+r.points:'Not quite';$('rinfo').innerHTML='Score: '+r.score+' · Rank: #'+r.rank+(r.bonus?'<br>'+LiveFX.icon('flame','hot')+' Streak bonus +'+r.bonus:'')+(r.streak>=2?'<br>'+LiveFX.icon('flame','hot')+' '+r.streak+' in a row':'')+(r.saved?'<br>'+LiveFX.icon('shield','good')+' Shield saved your streak!':'')+(r.doubled?'<br>'+LiveFX.icon('bolt','hot')+' Double Points!':'')+(r.jackpot&&r.correct?'<br>'+LiveFX.icon('star','hot')+' Jackpot x2!':'');$('lb').innerHTML=lbHTML(r);if(window.LiveFX){if(r.correct){LiveFX.confetti(90,.5,.35);LiveFX.vibrate([80,40,80])}else{LiveFX.shake();LiveFX.vibrate(220)}}})
socket.on('final',lb=>{sessionStorage.removeItem('liveSession');show('final');const m=lb.find(x=>x.name===me);$('fmsg').textContent=m?'You placed #'+m.rank+' with '+m.score+' points.':'';if(m&&m.rank<=3&&window.LiveFX){LiveFX.confetti(220,.5,.3);LiveFX.vibrate([100,50,100,50,200])}})
socket.on('ended',m=>{sessionStorage.removeItem('liveSession');show('final');$('fmsg').textContent=m})}
function join(){connect();socket.emit('player:join',{pin:$('pin').value.trim(),name:$('name').value},r=>{if(!r.ok){$('err').textContent=r.error;socket.disconnect();return}me=r.name;$('myav').textContent=LiveFX.avatar(me);pid=r.pid;pin=r.pin;sessionStorage.setItem('liveSession',JSON.stringify({pin,pid,name:me}));show('wait')})}
function sendText(){const el=$('tin');if(!el||el.disabled)return;const v=el.value.trim();if(!v)return;$('locked').textContent='Sending...';socket.emit('player:answer',{text:v},ok=>{if(ok){el.disabled=true;[...document.querySelectorAll('#opts button')].forEach(b=>b.disabled=true);$('locked').innerHTML=LiveFX.icon('lock')+' Answer locked in';window.LiveFX&&LiveFX.vibrate(30);$('bDbl').disabled=true;$('bHint').disabled=true}else $('locked').textContent='Not sent - try again.'})}
function pick(i){$('locked').textContent='Sending…';socket.emit('player:answer',{choice:i},ok=>{if(ok){[...$('opts').children].forEach((b,j)=>{b.disabled=true;if(j!==i)b.classList.add('dim')});$('locked').innerHTML=LiveFX.icon('lock')+' Answer locked in';window.LiveFX&&LiveFX.vibrate(30);$('bDbl').disabled=true;$('bHint').disabled=true}else $('locked').textContent='Not sent - tap your answer again.'})}
let PU={double:0,hint:0,shield:0}
function renderPU(d){PU=d.pu||PU;const a=d.answered
$('jp').innerHTML=d.jackpot?LiveFX.icon('star')+' FINAL JACKPOT: DOUBLE POINTS '+LiveFX.icon('star'):'';$('jp').classList.toggle('hide',!d.jackpot)
$('bDbl').innerHTML=LiveFX.icon('bolt')+(d.dbl?' Double ARMED':' Double x'+PU.double);$('bDbl').disabled=a||d.dbl||PU.double<1;$('bDbl').classList.toggle('armed',!!d.dbl)
$('bHint').innerHTML=LiveFX.icon('bulb')+(d.hasHint?' Hint x'+PU.hint:' No hint');$('bHint').disabled=a||d.hinted||PU.hint<1||!d.hasHint
$('bShd').innerHTML=LiveFX.icon('shield')+(d.shd?' Shield ARMED':' Shield x'+PU.shield);$('bShd').disabled=!!d.shd||PU.shield<1||!(d.streak>0);$('bShd').classList.toggle('armed',!!d.shd)
$('hintbox').innerHTML=d.hint?LiveFX.icon('bulb','hot')+' '+esc(d.hint):''}
function pdbl(){socket.emit('player:power',{type:'double'},r=>{if(r&&r.ok){PU=r.pu;$('bDbl').disabled=true;$('bDbl').classList.add('armed');$('bDbl').innerHTML=LiveFX.icon('bolt')+' Double ARMED'}})}
function phint(){socket.emit('player:hint',{},r=>{if(r&&r.ok){PU=r.pu;$('bHint').disabled=true;$('hintbox').innerHTML=LiveFX.icon('bulb','hot')+' '+esc(r.hint)}})}
function pshd(){socket.emit('player:power',{type:'shield'},r=>{if(r&&r.ok){PU=r.pu;$('bShd').disabled=true;$('bShd').classList.add('armed');$('bShd').innerHTML=LiveFX.icon('shield')+' Shield ARMED'}})}
function lbHTML(r){const row=p=>'<div class="row'+(p.name===me?' me':'')+'"><span>'+p.rank+'. '+LiveFX.avatar(p.name)+' '+esc(p.name)+(p.streak>=3?' '+LiveFX.icon('flame','hot'):'')+'</span><b>'+p.score+'</b></div>';let h=(r.top||[]).map(row).join('');if(r.rank>(r.top||[]).length)h+='<div style="text-align:center;opacity:.6">...</div><div class="row me"><span>'+r.rank+'. '+LiveFX.avatar(me)+' '+esc(me)+'</span><b>'+r.score+'</b></div>';return h}
const saved=JSON.parse(sessionStorage.getItem('liveSession')||'null');if(saved){pin=saved.pin;pid=saved.pid;me=saved.name;connect();show('wait')}
</script><script src="/js/dark-mode.js"></script><script src="/js/live-fx.js"></script></body></html>
